# Team onboarding identity
#
# The team onboarding Job (created by the AITeam KRO definition) runs in the
# ai-platform namespace with this ServiceAccount. It needs:
#   - Read the LiteLLM master key from ai-platform/litellm-secrets
#     (via env var; handled by kubelet, no explicit RBAC needed).
#   - Write the team's scoped API key into team-<name>/<team>-api-key.
#
# Secret writes are granted per-team by a namespaced Role + RoleBinding that the
# AITeam KRO resource graph creates in each team namespace (see the
# onboardingSecretRole/onboardingRolebinding resources in
# platform/config/kro/team-onboarding.yaml). That Role is scoped by resourceName
# to the single <team>-api-key Secret — NOT a cluster-wide secrets grant — so
# this file only needs to define the ServiceAccount. The SA lives in ai-platform;
# the master key never leaves ai-platform.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: team-onboarding
  namespace: ai-platform
  labels:
    app.kubernetes.io/part-of: ai-platform
    ai-platform/managed-by: platform-team
